# OAuth dynamic client registration is unauthenticated by protocol, and FastMCP
# stores each registration in Redis with no TTL -- every other store it writes
# has one. Left open, a single host can grow that store until Redis hits its
# mem_limit and locks out the allowlisted users. A legitimate client registers
# once per install, so this budget is generous.
#
# The empty map value is load-bearing: nginx does not account a request whose
# limit_req key is empty, so every other path stays unlimited without having to
# duplicate the proxy block into a second location.
#
# The variable and zone names are per-service on purpose: brave/firecrawl/lark
# share one nginx, and a reused zone name is a hard `nginx -t` failure that
# takes down every site on the host.
map $request_uri $firecrawl_register_key {
    default      "";
    ~^/register  $binary_remote_addr;
}
limit_req_zone $firecrawl_register_key zone=firecrawl_register:1m rate=10r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    client_max_body_size 2m;

    location / {
        limit_req zone=firecrawl_register burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
